name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: action/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
